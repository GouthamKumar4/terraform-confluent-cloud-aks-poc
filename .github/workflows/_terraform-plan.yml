###############################################################################
# Reusable Terraform Plan Template
# Steps: checkout → setup → fmt check → init → validate → plan → PR comment
# Called by: terraform-plan-*.yml callers
#
# Secrets are scoped via GitHub Environments (e.g., platform-poc, orders-poc).
# Each environment holds only the secrets that deployment target needs.
###############################################################################
name: "Reusable: Terraform Plan"

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Terraform root module directory"
        type: string
        required: true
      var_file:
        description: "Tfvars filename (e.g., platform-poc.tfvars)"
        type: string
        required: true
      backend_config:
        description: "Backend config file (e.g., backend-poc.hcl)"
        type: string
        required: true
      runner:
        description: "GitHub Actions runner label"
        type: string
        default: "ubuntu-latest"
      plan_label:
        description: "Label for PR comment header (e.g., Platform, Orders)"
        type: string
        required: true
      environment:
        description: "GitHub Environment name (e.g., platform-poc, orders-poc) — scopes secrets"
        type: string
        required: true

jobs:
  plan:
    name: ${{ inputs.plan_label }} Plan
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_USE_OIDC: true
      TF_VAR_azure_subscription_id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      TF_VAR_key_vault_id: ${{ secrets.KEY_VAULT_ID }}
      # Confluent credentials — scoped by GitHub Environment:
      #   platform-poc: OrganizationAdmin Cloud API key
      #   orders-poc:   ResourceOwner deployer Cloud API key for orders*
      #   payments-poc: ResourceOwner deployer Cloud API key for payments*
      TF_VAR_confluent_cloud_api_key: ${{ secrets.CONFLUENT_CLOUD_API_KEY }}
      TF_VAR_confluent_cloud_api_secret: ${{ secrets.CONFLUENT_CLOUD_API_SECRET }}
      # Runtime SA + cluster API key (app team environments only — empty for platform)
      TF_VAR_runtime_service_account_id: ${{ secrets.CONFLUENT_RUNTIME_SA_ID }}
      TF_VAR_runtime_api_key_id: ${{ secrets.CONFLUENT_RUNTIME_API_KEY }}
      TF_VAR_runtime_api_key_secret: ${{ secrets.CONFLUENT_RUNTIME_API_SECRET }}

    steps:
      - name: Validate environment matches var file
        run: |
          ENV_PREFIX=$(echo "${{ inputs.environment }}" | cut -d'-' -f1)
          VAR_PREFIX=$(echo "${{ inputs.var_file }}" | cut -d'-' -f1)
          if [ "$ENV_PREFIX" != "$VAR_PREFIX" ]; then
            echo "::error::Environment prefix '$ENV_PREFIX' does not match var_file prefix '$VAR_PREFIX'"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init -backend-config=${{ inputs.backend_config }}

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -var-file=${{ inputs.var_file }} -no-color -out=tfplan
        continue-on-error: true

      - name: Post Plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const output = `#### ${{ inputs.plan_label }} Plan 📋
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            *Triggered by @${{ github.actor }}*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail on Plan Error
        if: steps.plan.outcome == 'failure'
        run: exit 1
